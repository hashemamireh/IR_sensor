; IR Sensor Device — PlatformIO configuration
; Board: Waveshare ESP32-C5-WIFI6-KIT-N32R8

[env:irsensor]
platform = espressif32
framework = espidf
board = waveshare_esp32c5_n32r8
board_build.partitions = partitions.csv

monitor_speed = 115200

; ESP-IDF build flags
build_flags =
    -DCONFIG_LITTLEFS_FOR_IDF_3_2   ; LittleFS compat

; ESP-IDF sdkconfig overrides
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
