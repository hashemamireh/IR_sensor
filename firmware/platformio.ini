; IR Sensor Device — PlatformIO configuration
; Board: Waveshare ESP32-C5-WIFI6-KIT-N32R8

[platformio]
default_envs = irsensor

[env:irsensor]
platform = espressif32
framework = espidf
board = waveshare_esp32c5_n32r8
board_build.partitions = partitions.csv

monitor_speed = 115200

; ESP-IDF sdkconfig overrides
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; Same firmware, but the recorder generates a synthetic signal instead of
; reading the ADC — for checking the recording pipeline on a bare board.
; Build/flash with: pio run -e irsensor_synthetic -t upload
[env:irsensor_synthetic]
extends = env:irsensor
build_flags = -DIRSENSOR_SYNTHETIC_ADC

; Host-side unit tests for the hardware-independent code in lib/irsensor_core.
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
